<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stash</title>
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <main>
        <h1>Stash</h1>

        <section class="box">
            <h2>Ielogošanās</h2>
            <form id="loginForm">
                <label for="LoginName">Lietotājvārds</label>
                <input id="LoginName" type="text" required>

                <label for="LoginPass">Parole</label>
                <input id="LoginPass" type="password" required>

                <button type="submit">Ielogoties</button>
                <p id="loginmessage" class="message"></p>
            </form>
        </section>

        <section class="box">
            <h2>Konta izveide</h2>
            <form id="registerForm">
                <label for="RegLogin">Lietotājvārds</label>
                <input id="RegLogin" type="text" required>

                <label for="RegPass">Parole</label>
                <input id="RegPass" type="password" required>

                <label for="RegRole">Loma</label>
                <select id="RegRole" required>
                    <option value="" disabled selected>Izvēlies lomu</option>
                    <option value="admin">Administrators</option>
                    <option value="worker">Darbinieks</option>
                    <option value="sorter">Šķirotājs</option>
                </select>

                <button type="submit">Reģistrēties</button>
                <p id="regmessage" class="message"></p>
            </form>
        </section>
    </main>
    <script src="home.js"></script>
</body>
</html>
